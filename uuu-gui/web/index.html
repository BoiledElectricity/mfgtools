<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Flasher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Board Flasher</h1>
  <div id="usb-status" class="chip chip-gray">checking USB…</div>
</header>
<main>
  <section>
    <h2>1. Files</h2>
    <div id="dropzone">
      <div class="filerow">
        <span class="filerow-label">Bootloader</span>
        <button id="pick-boot-btn" class="small">Choose…</button>
        <span id="boot-name" class="filerow-name empty-name">imx-boot file</span>
        <span id="boot-meta" class="image-meta"></span>
      </div>
      <div class="filerow">
        <span class="filerow-label">Image</span>
        <button id="pick-image-btn" class="small">Choose…</button>
        <span id="image-name" class="filerow-name empty-name">.wic / .wic.lz4 file</span>
        <span id="image-meta" class="image-meta"></span>
      </div>
      <div class="filerow">
        <span class="filerow-label">Bmap</span>
        <button id="pick-bmap-btn" class="small">Choose…</button>
        <span id="bmap-name" class="filerow-name empty-name">.wic.bmap file</span>
        <span id="bmap-meta" class="image-meta"></span>
      </div>
      <div class="hint">You can also drag &amp; drop the files anywhere on this window — they sort into the right slot by name.</div>
    </div>
  </section>

  <section>
    <h2>2. Flash</h2>
    <div class="flash-row">
      <button id="flash-btn" disabled>⚡ Flash Board</button>
      <button id="cancel-btn" class="danger" hidden>Cancel</button>
      <span id="phase-label"></span>
    </div>

    <div id="progress-area" hidden>
      <div id="decomp-row" class="prog-row" hidden>
        <span class="prog-label">Decompressing</span>
        <div class="bar"><div id="decomp-bar" class="fill"></div></div>
        <span id="decomp-detail" class="prog-detail"></span>
        <span id="decomp-pct" class="prog-pct"></span>
      </div>
      <div id="device-rows"></div>
    </div>

    <div id="result-banner" hidden></div>

    <details id="log-details">
      <summary>Log</summary>
      <pre id="log"></pre>
    </details>
  </section>
</main>

<footer><span id="uuu-version"></span></footer>
<script src="app.js"></script>
</body>
</html>
