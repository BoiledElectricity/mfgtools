name: uuu-gui

on:
  push:
    branches:
      - master
    paths:
      - 'uuu-gui/**'
      - 'libuuu/**'
      - 'uuu/**'
      - '.github/workflows/uuu-gui.yaml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: microsoft/setup-msbuild@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Build static uuu sidecar
        run: |
          git fetch --tags --force
          msbuild /p:Configuration=Release /p:PlatformToolset=v143 /p:Platform=x64 /p:ForceImportBeforeCppTargets=${{ github.workspace }}/libusb.prop msvc/uuu-static-link.sln
          New-Item -ItemType Directory -Force uuu-gui/src-tauri/binaries | Out-Null
          Copy-Item msvc/x64/Release/uuu.exe uuu-gui/src-tauri/binaries/uuu-x86_64-pc-windows-msvc.exe
      - name: Build Board Flasher
        working-directory: uuu-gui/src-tauri
        run: |
          cargo test
          npx --yes "@tauri-apps/cli@^2" build
      - uses: actions/upload-artifact@v4
        with:
          name: BoardFlasher-windows-x64-setup
          path: |
            uuu-gui/src-tauri/target/release/bundle/nsis/*.exe
            uuu-gui/src-tauri/target/release/bundle/msi/*.msi

  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            triple: aarch64-apple-darwin
          - os: macos-14-intel
            arch: x86_64
            triple: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: brew install libusb pkg-config zstd zlib openssl@3 tinyxml2 cmake
      - uses: dtolnay/rust-toolchain@stable
      - name: Build portable uuu sidecar
        run: |
          git fetch --tags --force
          ./uuu-gui/build-uuu-macos.sh
      - name: Build Board Flasher
        working-directory: uuu-gui/src-tauri
        run: |
          cargo test
          npx --yes "@tauri-apps/cli@^2" build --target ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: BoardFlasher-mac-${{ matrix.arch }}
          path: uuu-gui/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            arch: arm64
            triple: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            libusb-1.0-0-dev libbz2-dev libzstd-dev libtinyxml2-dev cmake \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            build-essential curl wget file libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build static uuu sidecar
        run: |
          git fetch --tags --force
          git submodule update --init tinyxml2
          cd tinyxml2 && cmake . && make -j4 && cd ..
          cmake -D 'STATIC=1' -D 'FORCE_OLD=on' .
          make -j4
          mkdir -p uuu-gui/src-tauri/binaries
          cp uuu/uuu uuu-gui/src-tauri/binaries/uuu-${{ matrix.triple }}
      - name: Build Board Flasher
        working-directory: uuu-gui/src-tauri
        run: |
          cargo test
          npx --yes "@tauri-apps/cli@^2" build
      - uses: actions/upload-artifact@v4
        with:
          name: BoardFlasher-linux-${{ matrix.arch }}
          path: |
            uuu-gui/src-tauri/target/release/bundle/deb/*.deb
            uuu-gui/src-tauri/target/release/bundle/appimage/*.AppImage
